<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | College Bus Tracking System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot_password.css') }}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <div class="forgot-container">

        <div class="forgot-card">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="flash-message {{ category }}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <!-- ================= ICON ================= -->

            <div class="forgot-icon">

                <i class="fa-solid fa-mobile-screen-button"></i>

            </div>


            <!-- ================= TITLE ================= -->

            <h1>Forgot Password?</h1>


            <p class="subtitle">

                Reset your password securely using your
                registered email address.

            </p>


            <!-- ================= FORM ================= -->

            <form action="{{ url_for('forgot_password') }}" method="POST">


                <!-- ================= ROLE ================= -->

                <div class="role-selection">

                    <button type="button" class="role-card active" id="studentRole" onclick="selectRole('student')">

                        <i class="fa-solid fa-user-graduate"></i>

                        <span>Student</span>

                    </button>


                    <button type="button" class="role-card" id="driverRole" onclick="selectRole('driver')">

                        <i class="fa-solid fa-bus"></i>

                        <span>Driver</span>

                    </button>

                </div>


                <input type="hidden" name="role" id="role" value="student">


                <!-- ================= USERNAME ================= -->

                <div class="input-box">

                    <i class="fa-solid fa-id-card"></i>

                    <input type="text" name="username" id="username" placeholder="Enter Roll Number" required
                        autocomplete="off">

                </div>


                <!-- ================= EMAIL ================= -->

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input type="email" name="email" id="email" placeholder="Enter Registered Email Address" required
                        autocomplete="email">

                </div>
                <!-- ================= SEND OTP ================= -->

                <button type="submit" class="reset-btn">

                    <i class="fa-solid fa-message"></i>

                    Send OTP

                </button>

            </form>


            <!-- ================= BACK ================= -->

            <a href="{{ url_for('login') }}" class="back-login">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Login

            </a>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        function selectRole(role) {

            const studentRole =
                document.getElementById("studentRole");

            const driverRole =
                document.getElementById("driverRole");

            const roleInput =
                document.getElementById("role");

            const username =
                document.getElementById("username");

            roleInput.value = role;


            if (role === "student") {

                studentRole.classList.add("active");

                driverRole.classList.remove("active");

                username.placeholder =
                    "Enter Roll Number";

            }

            else {

                driverRole.classList.add("active");

                studentRole.classList.remove("active");

                username.placeholder =
                    "Enter License Number";

            }

        }

    </script>

</body>

</html>
