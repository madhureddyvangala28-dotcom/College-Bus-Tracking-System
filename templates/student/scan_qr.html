<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Scan Bus QR | College Bus Tracking System</title>

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- QR Scanner Library -->

    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #f4f7fb,
                    #e9eef5
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        /* ==========================================
                    MAIN CONTAINER
        ========================================== */

        .scan-container {

            width: 100%;

            max-width: 500px;
        }


        /* ==========================================
                    CARD
        ========================================== */

        .scan-card {

            background: #ffffff;

            border-radius: 25px;

            padding: 35px 25px;

            text-align: center;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.12);
        }


        /* ==========================================
                    QR ICON
        ========================================== */

        .scan-icon {

            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            border-radius: 22px;

            background: #FFC107;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 34px;

            color: #111827;

            box-shadow:
                0 10px 25px
                rgba(255, 193, 7, 0.35);
        }


        /* ==========================================
                    TEXT
        ========================================== */

        h1 {

            font-size: 27px;

            color: #111827;

            margin-bottom: 8px;
        }


        .subtitle {

            color: #64748B;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 25px;
        }


        /* ==========================================
                    QR SCANNER
        ========================================== */

        #reader {

            width: 100%;

            overflow: hidden;

            border-radius: 18px;

            border: 3px solid #FFC107;

            background: #f8fafc;
        }


        /* ==========================================
                    STATUS
        ========================================== */

        .status {

            margin-top: 20px;

            padding: 14px;

            border-radius: 12px;

            background: #f1f5f9;

            color: #475569;

            font-size: 14px;

            font-weight: 500;

            line-height: 1.5;
        }


        .status.success {

            background: #DCFCE7;

            color: #166534;
        }


        .status.error {

            background: #FEE2E2;

            color: #991B1B;
        }


        /* ==========================================
                    BACK BUTTON
        ========================================== */

        .back-btn {

            width: 100%;

            height: 52px;

            margin-top: 20px;

            border: none;

            border-radius: 14px;

            background: #111827;

            color: white;

            text-decoration: none;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            font-size: 14px;

            font-weight: 600;

            transition: 0.3s;
        }


        .back-btn:hover {

            background: #374151;

            transform: translateY(-2px);
        }


        /* ==========================================
                    MOBILE
        ========================================== */

        @media(max-width: 500px) {

            body {

                padding: 15px;
            }


            .scan-card {

                padding: 30px 18px;

                border-radius: 20px;
            }


            h1 {

                font-size: 23px;
            }


            .scan-icon {

                width: 70px;

                height: 70px;

                font-size: 28px;
            }

        }

    </style>

</head>


<body>


    <div class="scan-container">


        <div class="scan-card">


            <!-- QR ICON -->

            <div class="scan-icon">

                <i class="fa-solid fa-qrcode"></i>

            </div>


            <!-- TITLE -->

            <h1>Scan Bus QR</h1>


            <!-- SUBTITLE -->

            <p class="subtitle">

                Scan the QR code displayed by your bus driver
                to confirm your boarding and update seat availability.

            </p>


            <!-- QR CAMERA -->

            <div id="reader"></div>


            <!-- STATUS -->

            <div
                id="status"
                class="status">

                <i class="fa-solid fa-camera"></i>

                Camera is ready. Scan the Bus QR Code.

            </div>


            <!-- BACK BUTTON -->

            <a
                href="{{ url_for('student_dashboard') }}"
                class="back-btn">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Dashboard

            </a>


        </div>


    </div>



    <!-- ==========================================
                QR SCANNER JAVASCRIPT
    ========================================== -->

    <script>


        let scannerStarted = true;


        function onScanSuccess(decodedText, decodedResult) {


            /* --------------------------------------
                PREVENT MULTIPLE SCANS
            -------------------------------------- */

            if (!scannerStarted) {

                return;

            }


            scannerStarted = false;


            const statusBox =
                document.getElementById("status");


            /* --------------------------------------
                SHOW VERIFYING MESSAGE
            -------------------------------------- */

            statusBox.className =
                "status";


            statusBox.innerHTML =

                '<i class="fa-solid fa-spinner fa-spin"></i> '
                +
                'Verifying your boarding...';


            /* --------------------------------------
                STOP CAMERA
            -------------------------------------- */

            html5QrcodeScanner.clear()
                .catch(error => {

                    console.log(
                        "Camera stop error:",
                        error
                    );

                });


            /* --------------------------------------
                SEND QR DATA TO FLASK
            -------------------------------------- */

            fetch(
                "/student/verify_bus_qr",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:

                        JSON.stringify({

                            qr_data:
                                decodedText

                        })

                }
            )


            /* --------------------------------------
                GET RESPONSE
            -------------------------------------- */

            .then(response => {

                return response.json();

            })


            .then(data => {


                /* ==================================
                    SUCCESS
                ================================== */

                if (data.success) {


                    statusBox.className =
                        "status success";


                    statusBox.innerHTML =

                        '<i class="fa-solid fa-circle-check"></i> '
                        +
                        data.message;


                    /* Redirect to dashboard */

                    setTimeout(() => {

                        window.location.href =
                            "{{ url_for('student_dashboard') }}";

                    }, 2500);


                }


                /* ==================================
                    ERROR
                ================================== */

                else {


                    statusBox.className =
                        "status error";


                    statusBox.innerHTML =

                        '<i class="fa-solid fa-circle-xmark"></i> '
                        +
                        data.message;


                    /* Reload and allow scanning again */

                    setTimeout(() => {

                        window.location.reload();

                    }, 3000);


                }


            })


            /* ======================================
                    NETWORK ERROR
            ====================================== */

            .catch(error => {


                console.error(
                    "QR Verification Error:",
                    error
                );


                statusBox.className =
                    "status error";


                statusBox.innerHTML =

                    '<i class="fa-solid fa-circle-xmark"></i> '
                    +
                    'Something went wrong. Please try again.';


                setTimeout(() => {

                    window.location.reload();

                }, 3000);


            });

        }



        /* ==========================================
                    SCAN FAILURE
        ========================================== */

        function onScanFailure(error) {

            /*
                Normal scanning errors happen
                continuously while searching for QR.

                We don't show them to the user.
            */

        }



        /* ==========================================
                    START QR SCANNER
        ========================================== */

        const html5QrcodeScanner =

            new Html5QrcodeScanner(

                "reader",

                {

                    fps: 10,

                    qrbox: {

                        width: 250,

                        height: 250

                    }

                },

                false

            );


        html5QrcodeScanner.render(

            onScanSuccess,

            onScanFailure

        );


    </script>


</body>

</html>
