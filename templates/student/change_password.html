<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/change_password.css') }}">

</head>

<body>

<!-- ======================================
     DESKTOP CONTENT
====================================== -->

<div class="desktop-content">

    <!-- Desktop Header -->

    <div class="desktop-header">

        <div class="desktop-title">

            <a href="{{ url_for('student_dashboard') }}"
               class="desktop-back">

                <i class="fa-solid fa-arrow-left"></i>

            </a>

            <div>

                <h1>Change Password</h1>

                <p>Update your account password securely.</p>

            </div>

        </div>


    </div>

</div>

<div class="container">

    <div class="desktop-password-card password-card">

        <div class="mobile-header header">

            <a href="{{ url_for('student_dashboard') }}"
               class="back-btn">

                <i class="fa-solid fa-arrow-left"></i>

            </a>

            <h2>

                Change Password

            </h2>

        </div>

        <p class="subtitle">

            Update your account password securely.

        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}

            {% for category, message in messages %}

                <div class="alert {{ category }}">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}
        {% endwith %}

        <form id="changePasswordForm"
              action="{{ url_for('update_password') }}"
              method="POST">

            <!-- Current Password -->

        <div class="desktop-form-grid">
            <div class="input-group">

                <label>

                    Current Password

                </label>

                <div class="password-box">

                    <input
                        type="password"
                        name="current_password"
                        id="current_password"
                        required>

                    <i class="fa-solid fa-eye toggle-password"
                       onclick="togglePassword('current_password', this)"></i>

                </div>

            </div>

            <!-- New Password -->

            <div class="input-group">

                <label>

                    New Password

                </label>

                <div class="password-box">

                    <input
                        type="password"
                        name="new_password"
                        id="new_password"
                        required>

                    <i class="fa-solid fa-eye toggle-password"
                       onclick="togglePassword('new_password', this)"></i>

                </div>

            </div>

            <!-- Confirm Password -->

            <div class="input-group">

                <label>

                    Confirm Password

                </label>

                <div class="password-box">

                    <input
                        type="password"
                        name="confirm_password"
                        id="confirm_password"
                        required>

                    <i class="fa-solid fa-eye toggle-password"
                       onclick="togglePassword('confirm_password', this)"></i>

                </div>

            </div>
        </div>
    <div class="desktop-buttons">

        <button
            type="submit"
            class="save-btn">

                <i class="fa-solid fa-key"></i>

                Update Password

         </button>
    </div>

</form>

</div>

</div>

<script src="{{ url_for('static', filename='js/change_password.js') }}"></script>

</body>

</html>
