<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Profile</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/edit_profile.css') }}">

</head>

<body>
<!-- ======================================
     DESKTOP CONTENT
====================================== -->

<div class="desktop-content">

    <!-- Top Header -->

    <div class="desktop-header">

        <div class="desktop-title">

            <a href="{{ url_for('student_profile') }}" class="desktop-back">

                <i class="fa-solid fa-arrow-left"></i>

            </a>

            <div>

                <h1>Edit Profile</h1>

                <p>Edit your profile details</p>

            </div>

        </div>

        <button type="submit"
                form="editProfileForm"
                class="desktop-save-btn">

            <i class="fa-solid fa-floppy-disk"></i>

            Save Changes

        </button>

    </div>
</div>

<div class="mobile-container">

    <!-- ======================================
         HEADER
    ======================================= -->

    <header class="edit-header">

        <a href="{{ url_for('student_profile') }}"
           class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

        </a>

        <h2>Edit Profile</h2>

    </header>

    <!-- ======================================
         FLASH MESSAGE
    ======================================= -->

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}

            {% for category, message in messages %}

                <div class="alert {{ category }}">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}
    {% endwith %}

    <!-- ======================================
         EDIT PROFILE FORM
         IMPORTANT:
         The profile image section MUST be
         INSIDE this form.
    ======================================= -->

    <form id="editProfileForm"
          action="{{ url_for('update_profile') }}"
          method="POST"
          enctype="multipart/form-data">
    <!-- ======================================
         PROFILE IMAGE
    ======================================= -->

    <div class="desktop-profile-card profile-section">

        {% if student.profile_image %}

            <img
                id="previewImage"
                src="{{ url_for('static', filename='images/students/' + student.profile_image) }}"
                class="profile-image"
                alt="Profile Image">

        {% else %}

            <img
                id="previewImage"
                src="{{ url_for('static', filename='images/students/student.png') }}"
                class="profile-image"
                alt="Profile Image">

        {% endif %}

        <label for="profileImage" class="change-photo-btn">

            <i class="fa-solid fa-camera"></i>

            Change Photo

        </label>

        <input
            type="file"
            id="profileImage"
            name="profile_image"
            accept=".jpg,.jpeg,.png,image/*"
            hidden>

    </div>

    <!-- ======================================
         BASIC DETAILS
    ======================================= -->

    <div class="desktop-form-grid">
    <div class="form-group">

        <label for="student_name">Student Name</label>

        <input
            type="text"
            id="student_name"
            name="student_name"
            value="{{ student.student_name }}"
            required>

    </div>

    <div class="form-group">

        <label for="roll_number">Roll Number</label>

        <input
            type="text"
            id="roll_number"
            value="{{ student.roll_number }}"
            readonly>

    </div>

    <div class="form-group">

        <label for="department">Department</label>

        <input
            type="text"
            id="department"
            name="department"
            value="{{ student.department }}">

    </div>

    <div class="form-group">

        <label for="semester">Semester</label>

        <input
            type="text"
            id="semester"
            name="semester"
            value="{{ student.semester }}">

    </div>
        <!-- ======================================
         CONTACT DETAILS
    ======================================= -->

    <div class="form-group">

        <label for="phone">Phone</label>

        <input
            type="text"
            id="phone"
            name="phone"
            value="{{ student.phone }}"
            maxlength="10">

    </div>

    <div class="form-group">

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            name="email"
            value="{{ student.email }}">

    </div>

    <!-- ======================================
         PARENT DETAILS
    ======================================= -->

    <div class="form-group">

        <label for="parent_name">Parent Name</label>

        <input
            type="text"
            id="parent_name"
            name="parent_name"
            value="{{ student.parent_name }}">

    </div>

    <div class="form-group">

        <label for="parent_phone">Parent Phone</label>

        <input
            type="text"
            id="parent_phone"
            name="parent_phone"
            value="{{ student.parent_phone }}"
            maxlength="10">

    </div>

    <!-- ======================================
         ADDRESS
    ======================================= -->

    <div class="form-group">

        <label for="address">Address</label>

        <textarea
            id="address"
            name="address"
            rows="4">{{ student.address }}</textarea>

    </div>

</div>

    <!-- ======================================
         BUTTONS
    ======================================= -->

    <div class="desktop-buttons button-group">

        <a href="{{ url_for('student_profile') }}"
           class="cancel-btn">

            Cancel

        </a>

        <button
            type="submit"
            class="save-btn">

            <i class="fa-solid fa-floppy-disk"></i>

            Save Changes

        </button>

    </div>

</form>

</div>

<!-- desktop-content -->

<!-- ======================================
     IMAGE PREVIEW SCRIPT
======================================= -->

<script>

const profileInput = document.getElementById("profileImage");
const previewImage = document.getElementById("previewImage");

if(profileInput){

    profileInput.addEventListener("change", function(){

        const file = this.files[0];

        if(file){

            previewImage.src = URL.createObjectURL(file);

        }

    });

}

</script>

</body>

</html>
