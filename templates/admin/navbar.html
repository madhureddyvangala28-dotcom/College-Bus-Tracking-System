<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/navbar.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<nav class="navbar">

    <!-- ================= Logo ================= -->

    <div class="logo-area">

        <img
        src="{{ url_for('static', filename='images/logo.png') }}"
        alt="Logo">

        <div class="logo-text">

            <h2>College Bus Tracking System</h2>

        </div>

    </div>

    <!-- ================= Menu ================= -->

    <ul class="nav-links">
        <li>

            <a
            href="{{ url_for('dashboard') }}"
            class="{% if active_page=='dashboard' %}active{% endif %}">

                <i class="fas fa-chart-line"></i>

                <span>Dashboard</span>

            </a>

        </li>

        <li>

            <a
            href="{{ url_for('students') }}"
            class="{% if active_page=='students' %}active{% endif %}">

                <i class="fas fa-user-graduate"></i>

                <span>Students</span>

            </a>

        </li>

        <li>

            <a
            href="{{ url_for('drivers') }}"
            class="{% if active_page=='drivers' %}active{% endif %}">

                <i class="fas fa-id-card"></i>

                <span>Drivers</span>

            </a>

        </li>

        <li>

            <a
            href="{{ url_for('buses') }}"
            class="{% if active_page=='buses' %}active{% endif %}">

                <i class="fas fa-bus"></i>

                <span>Buses</span>

            </a>

        </li>

        <li>

            <a
            href="{{ url_for('routes') }}"
            class="{% if active_page=='routes' %}active{% endif %}">

                <i class="fas fa-route"></i>

                <span>Routes</span>

            </a>

        </li>

    </ul>

    <!-- ================= Logout ================= -->

    <div class="logout">

        <a href="{{ url_for('logout') }}">

            <i class="fas fa-right-from-bracket"></i>

            Logout

        </a>

    </div>

</nav>

</body>

</html>
