<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | College Bus Tracking System</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/forgot_password.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="forgot-container">

    <div class="forgot-card">


        <!-- ================= ICON ================= -->

        <div class="forgot-icon">

            <i class="fa-solid fa-lock"></i>

        </div>


        <!-- ================= TITLE ================= -->

        <h1>Create New Password</h1>

        <p class="subtitle">

            Enter a new password for your account.

        </p>


        <!-- ================= FORM ================= -->

        <form
            action="{{ url_for('reset_password') }}"
            method="POST">


            <!-- ================= NEW PASSWORD ================= -->

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    name="password"
                    id="newPassword"
                    placeholder="New Password"
                    minlength="8"
                    required
                >

                <!-- SHOW / HIDE PASSWORD -->

                <button
                    type="button"
                    class="password-toggle"
                    onclick="togglePassword('newPassword', 'newPasswordIcon')"
                    aria-label="Show or hide password"
                >

                    <i
                        class="fa-solid fa-eye"
                        id="newPasswordIcon"
                    ></i>

                </button>

            </div>


            <!-- ================= CONFIRM PASSWORD ================= -->

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    name="confirm_password"
                    id="confirmPassword"
                    placeholder="Confirm New Password"
                    minlength="8"
                    required
                >

                <!-- SHOW / HIDE PASSWORD -->

                <button
                    type="button"
                    class="password-toggle"
                    onclick="togglePassword('confirmPassword', 'confirmPasswordIcon')"
                    aria-label="Show or hide password"
                >

                    <i
                        class="fa-solid fa-eye"
                        id="confirmPasswordIcon"
                    ></i>

                </button>

            </div>


            <!-- ================= RESET BUTTON ================= -->

            <button
                type="submit"
                class="reset-btn">

                <i class="fa-solid fa-key"></i>

                Reset Password

            </button>

        </form>

    </div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script>

function togglePassword(inputId, iconId) {

    const passwordInput =
        document.getElementById(inputId);

    const passwordIcon =
        document.getElementById(iconId);


    if (passwordInput.type === "password") {

        // SHOW PASSWORD

        passwordInput.type = "text";

        passwordIcon.classList.remove("fa-eye");

        passwordIcon.classList.add("fa-eye-slash");

    }

    else {

        // HIDE PASSWORD

        passwordInput.type = "password";

        passwordIcon.classList.remove("fa-eye-slash");

        passwordIcon.classList.add("fa-eye");

    }

}

</script>

</body>

</html>
